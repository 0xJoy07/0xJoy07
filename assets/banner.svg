<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Joy Sengupta — I build smart things</title>
  <desc id="description">Joy's blue desktop. Full-stack engineer, GenAI builder and AI/ML explorer, always building.</desc>
  <defs>
    <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.85" fill="#c8dfff"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#304d73" flood-opacity=".28"/>
    </filter>
    <clipPath id="window"><rect x="88" y="42" width="1024" height="336" rx="18"/></clipPath>
    <style>
      .cursor { animation: blink 1.4s steps(1) infinite; }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor { animation: none; opacity: 0; } }
    </style>
  </defs>
  <path fill="#a9cdf7" d="M0 0h1200v420H0z"/>
  <rect x="88" y="42" width="1024" height="336" rx="18" fill="#fff" filter="url(#shadow)"/>
  <g clip-path="url(#window)">
    <path fill="#f4f6fa" d="M88 42h1024v46H88z"/>
    <circle cx="120" cy="65" r="7" fill="#ff5f57"/>
    <circle cx="144" cy="65" r="7" fill="#ffbd2e"/>
    <circle cx="168" cy="65" r="7" fill="#28c840"/>
    <text x="600" y="70" text-anchor="middle" fill="#526078" font-family="Arial, Helvetica, sans-serif" font-size="16">Joy's desktop</text>
    <path fill="url(#paper)" d="M112 110h978v238H112z"/>
    <text x="600" y="220" text-anchor="middle" fill="#61a3ff" font-family="Rockwell, 'Courier New', monospace" font-size="68" font-weight="700" letter-spacing="1">JOY SENGUPTA</text>
    <rect x="410" y="246" width="380" height="54" rx="9" fill="#fff" stroke="#6aa6ff" stroke-width="3"/>
    <text x="469" y="281" fill="#202a36" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">I build</text>
    <text x="551" y="281" fill="#3e6da8" font-family="'Courier New', monospace" font-size="20" font-weight="700">smart things</text>
    <path class="cursor" d="M702 265v19" stroke="#61a3ff" stroke-width="2"/>
    <text x="600" y="326" text-anchor="middle" fill="#7d8da6" font-family="Arial, Helvetica, sans-serif" font-size="15">full-stack engineer · genai + ai/ml · always building</text>
  </g>
</svg>
